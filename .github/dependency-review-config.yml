fail-on-severity: high
fail-on-scopes: runtime, development, unknown
license-check: true
vulnerability-check: true
warn-only: false
show-openssf-scorecard: false
show-patched-versions: true
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC0-1.0
  - ISC
  - MIT
  - MIT-0
  - MPL-2.0
  - Unlicense
# GitHub's dependency graph has incomplete license metadata for Go modules:
# it either finds nothing, or (for the golang.org/x/* packages) appends a
# non-standard "LicenseRef-scancode-google-patent-license-golang" suffix to
# a genuine BSD-3-Clause license (Go's LICENSE file includes an additional
# patent-grant paragraph). Independently verified against deps.dev on
# 2026-08-10 — every package below is MIT or BSD-3-Clause, matching the
# allow-licenses list above; this works around detection, not policy.
allow-dependencies-licenses:
  - pkg:golang/github.com/aymanbagabas/go-osc52/v2@2.0.1
  - pkg:golang/github.com/charmbracelet/bubbletea@1.3.10
  - pkg:golang/github.com/charmbracelet/lipgloss@1.1.0
  - pkg:golang/github.com/charmbracelet/x/ansi@0.10.1
  - pkg:golang/github.com/mattn/go-isatty@0.0.20
  - pkg:golang/github.com/mattn/go-runewidth@0.0.16
  - pkg:golang/github.com/muesli/ansi@0.0.0-20230316100256-276c6243b2f6
  - pkg:golang/github.com/muesli/cancelreader@0.2.2
  - pkg:golang/github.com/muesli/termenv@0.16.0
  - pkg:golang/github.com/rivo/uniseg@0.4.7
  - pkg:golang/golang.org/x/sys@0.36.0
  - pkg:golang/golang.org/x/text@0.3.8
