name: Installer compatibility watch

# orbit-launcher fetches install.sh live from orbit's own repository at
# runtime (see internal/deploy/fetch.go) rather than vendoring it, so any
# change to that script's prompts, flags, or behavior takes effect for
# every user immediately, with no orbit-launcher release in between. This
# job is the early-warning system for that: it runs orbit-launcher's real
# PTY-driven live test suite against the *changing* install.sh (develop,
# then preview, then main) instead of only the stable script it ships
# against in production, and files an issue the moment a change breaks
# something orbit-launcher relies on.
#
# Two triggers, deliberately redundant:
#   - repository_dispatch from orbit's own "notify launcher on installer
#     change" workflow, for a fast, targeted signal right after a real
#     change lands.
#   - a weekly schedule, as a backstop in case the dispatch token expires,
#     the source workflow is disabled, or a push is missed — see
#     docs/implementation-plan.md section 3.5.

on:
  repository_dispatch:
    types: [orbit-installer-scripts-changed]
  schedule:
    - cron: "17 6 * * 1" # Monday mornings, backstop only
  workflow_dispatch:
    inputs:
      orbit_branch:
        description: "orbit branch to test install.sh from"
        required: false
        default: develop

permissions:
  contents: read
  issues: write

jobs:
  compat-check:
    name: Live test against orbit@${{ github.event.client_payload.branch || inputs.orbit_branch || 'develop' }}
    runs-on: ubuntu-latest
    # Above the suite's own 30m budget, so a slow run fails with a
    # readable Go-level error instead of being cancelled mid-assertion.
    # Measured: a healthy run against the current pre-release generation
    # takes ~7m, most of it a real first-boot (image pull, ClamAV
    # database, health wait).
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve target branch, install.sh URL, and image channel
        run: |
          branch="${{ github.event.client_payload.branch || inputs.orbit_branch || 'develop' }}"
          sha="${{ github.event.client_payload.sha || '' }}"
          echo "ORBIT_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "ORBIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "ORBIT_LAUNCHER_INSTALL_SCRIPT_URL=https://raw.githubusercontent.com/tomlawesome/orbit/$branch/scripts/install.sh" >> "$GITHUB_ENV"

          # install.sh and the image it verifies are one generation and must
          # be tested as one. orbit's publish workflow tags every pre-release
          # build "preview" and only moves "latest" on promotion to main, so
          # a pre-release install.sh paired with the default channel installs
          # the *promoted production* image — and fails on any identity check
          # that image predates. Proved by running orbit develop's install.sh
          # against latest: it verifies the image by invoking its entrypoint
          # with --banner, the production v1.2.0 entrypoint has no such
          # branch, falls through to its secret bootstrap and dies. That is a
          # mismatch this job created, not a compatibility break — and this
          # job files an issue on failure, so it would have been a false
          # alarm every time. install.sh reads ORBIT_CHANNEL itself and the
          # launcher never sets the engine's environment, so exporting it
          # here reaches the engine unchanged.
          case "$branch" in
            main) channel="latest" ;;
            *) channel="preview" ;;
          esac
          echo "ORBIT_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Build orbit-launcher from source
        run: |
          go build -o "$RUNNER_TEMP/orbit-launcher" ./cmd/orbit-launcher
          echo "ORBIT_LAUNCHER_LIVE_BINARY=$RUNNER_TEMP/orbit-launcher" >> "$GITHUB_ENV"

      - name: Run the live test against orbit's install.sh
        id: live_test
        env:
          ORBIT_LAUNCHER_LIVE_RAW_LOG: ${{ runner.temp }}/live-raw.log
        run: go test -tags live -count=1 -v -timeout 30m ./test/live/...

      - name: Docker state (always, for debugging)
        if: always()
        run: |
          docker ps -a || true
          docker volume ls || true

      - name: Upload raw pty transcript (always, for debugging)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-raw-log
          path: ${{ runner.temp }}/live-raw.log.*
          if-no-files-found: ignore
          retention-days: 7

      - name: File an issue on failure
        if: failure() && steps.live_test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Installer compatibility check failed against orbit@${ORBIT_BRANCH}"
          existing="$(gh issue list --repo "${{ github.repository }}" --label installer-compat --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Still failing as of this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commented on existing issue #$existing instead of filing a duplicate."
            exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "orbit-launcher's live install/remove test failed running against orbit's \`${ORBIT_BRANCH}\` branch install.sh${ORBIT_SHA:+ (${ORBIT_SHA})}, instead of the \`main\` script it ships against in production." \
            "This means a pending change to install.sh's prompts, flags, or behavior on \`${ORBIT_BRANCH}\` is incompatible with orbit-launcher's current handoff logic. If this reaches \`main\` before it's fixed, real installs will break immediately — orbit-launcher fetches install.sh live at runtime, not a pinned/vendored copy." \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "Raw pty transcript is attached to the run as the \`live-raw-log\` artifact.")
          gh issue create --repo "${{ github.repository }}" --title "$title" --label installer-compat --body "$body"
