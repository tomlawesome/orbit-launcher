name: Visual regression

on:
  pull_request:
    paths:
      - "internal/ui/**"
      - "test/visual/**"
      - ".github/workflows/visual-regression.yml"

permissions:
  contents: read

jobs:
  visual:
    name: Screenshot the rendered TUI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/visual/package-lock.json

      - name: Install ttyd
        run: |
          curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /usr/local/bin/ttyd

      - name: Install visual-test dependencies
        working-directory: test/visual
        run: npm ci

      - name: Install Playwright browser
        working-directory: test/visual
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        working-directory: test/visual
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: test/visual/playwright-report/
          retention-days: 14
