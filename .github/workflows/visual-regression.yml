name: Visual regression

# Both triggers, as ci.yml has them: GitLab merges and pushes the merged
# branches to this mirror, so a pull_request event never happens here and
# the push is the run that counts (#224).
on:
  push:
    branches:
      - main
      - dev
      - preview
      - "hotfix/**"
    paths:
      - "internal/ui/**"
      - "test/visual/**"
      - "scripts/ci/run-unprivileged.sh"
      - ".github/workflows/visual-regression.yml"
  pull_request:
    branches:
      - main
      - dev
      - preview
      - "hotfix/**"
    paths:
      - "internal/ui/**"
      - "test/visual/**"
      - "scripts/ci/run-unprivileged.sh"
      - ".github/workflows/visual-regression.yml"

permissions:
  contents: read

jobs:
  visual:
    name: Screenshot the rendered TUI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The same pinned Playwright image GitLab's visual job runs in (#216,
    # SU-5): the exact Chromium test/visual/package-lock.json expects, and the
    # same system fonts, so a screenshot difference means the same thing on
    # both hosts. Typed in, because a job's `container:` cannot read `env`;
    # copied from .gitlab-ci.yml's PLAYWRIGHT_IMAGE, and test/supplychain
    # fails when the two differ. Renovate's playwright group moves both.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

    env:
      # Copied from .gitlab-ci.yml's variables, the source of truth;
      # test/supplychain fails when a copy here differs (#216).
      TTYD_VERSION: "1.7.7"
      TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55

    # Inside `container:` GitHub runs `run:` steps with sh, which has no
    # pipefail, so "Install ttyd" stopped at its first line (#289).
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite runs as an unprivileged user (#292); leave no token on
          # disk for it to read.
          persist-credentials: false

      # Inside `container:` the workspace belongs to the host's runner user
      # while the steps run as root, so git refuses the repository as
      # "dubious ownership". actions/checkout marks it safe only for its own
      # step; without this, scripts/ci/run-unprivileged.sh's `git ls-files`
      # (which copies the tree for the suite below, as root) fails with exit
      # status 128 (reproduced with GIT_TEST_ASSUME_DIFFERENT_OWNER=1).
      # Unproven on GitHub until this workflow runs on the mirror again (#224).
      - name: Trust the checked-out workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Node and the browser come with the image, as on GitLab: no
      # setup-node and no `playwright install` here.
      - name: Install ttyd
        run: |
          set -euo pipefail
          bash scripts/ci/fetch-verified.sh \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64" \
            "${TTYD_SHA256}" /usr/local/bin/ttyd
          chmod +x /usr/local/bin/ttyd

      # The launcher refuses root (#291) and `container:` runs steps as
      # root, so the suite -- npm, the browser, ttyd and the binary it
      # builds -- runs as an unprivileged user over a copy it owns, as
      # GitLab's visual job does (#292); its results, where a failure's
      # screenshots and diffs go, come back for the upload below. The
      # config's only reporter is `list`, so there is no HTML report (#277).
      - name: Run visual regression tests
        run: |
          bash scripts/ci/run-unprivileged.sh --chdir test/visual \
            --keep test/visual/test-results \
            -- bash -c 'npm ci && npx playwright test'

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test/visual/test-results/
          retention-days: 14
