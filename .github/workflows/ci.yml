name: CI

on:
  push:
    branches:
      - main
      - develop
      - preview
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
      - preview
      - "hotfix/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: Static and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go build ./... && go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Planning governance
        if: github.event_name == 'pull_request'
        env:
          ORBIT_LAUNCHER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORBIT_LAUNCHER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ORBIT_LAUNCHER_PR_BODY: ${{ github.event.pull_request.body }}
        run: go run ./tools/checkgovernance

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload diagnostic coverage
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
