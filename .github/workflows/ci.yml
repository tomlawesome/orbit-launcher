name: CI

# GitLab runs these checks on a merge request into dev and on nothing after the
# merge (#306), so the mirrored push of dev, preview and main does not run
# them here either. Hotfix branches have no stage on GitLab; they keep theirs.
on:
  push:
    branches:
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - dev
      - preview
      - "hotfix/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: Static and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      # Copied from .gitlab-ci.yml's variables, the source of truth;
      # test/supplychain fails when a copy here differs (#216).
      STATICCHECK_VERSION: 452d5bb86b45416c35891262f6a11dbd6a970117
      BATS_VERSION: "1.14.0"
      BATS_SHA256: bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go build ./... && go vet ./...

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh scripts/ci/*.sh

      - name: Set up bats
        run: |
          set -euo pipefail
          bash scripts/ci/fetch-verified.sh \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" \
            "${BATS_SHA256}" "${RUNNER_TEMP}/bats.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bats-core"
          tar -xzf "${RUNNER_TEMP}/bats.tar.gz" -C "${RUNNER_TEMP}/bats-core" --strip-components=1
          echo "${RUNNER_TEMP}/bats-core/bin" >> "$GITHUB_PATH"

      - name: Test shell scripts
        run: bats scripts/test/

      - name: Install staticcheck
        run: go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Test
        run: scripts/coverage.sh -race

      - name: Check coverage floors
        run: go run ./tools/coveragefloor coverage.out

      - name: Upload diagnostic coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
