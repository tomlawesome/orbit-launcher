name: Secret scan

# GitHub's free tier gives this public repository secret scanning and push
# protection for PARTNER patterns only: credential formats that a provider has
# registered with GitHub. Non-provider patterns and validity checks are part of
# the paid Secret Protection add-on and read `disabled` here (see #115).
#
# That leaves generic secrets — private keys, connection strings, bespoke
# application tokens — with no server-side detection at all. This host runs a
# gitleaks pre-commit gate which covers that class, but it only covers commits
# made on this host, and only while the hook is installed and not bypassed.
#
# This job closes that gap for anything that reaches the remote. It detects
# rather than prevents: push protection is still the only control that stops a
# secret landing. Treat a failure here as "rotate the credential", not just
# "amend the commit".

on:
  push:
    branches:
      - main
      - dev
      - preview
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - dev
      - preview
      - "hotfix/**"

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      # gitleaks itself is MIT. The gitleaks/gitleaks-action wrapper is not —
      # it carries no recognised OSS licence (GitHub reports NOASSERTION) and
      # is commercially licensed for organisations. Installing the released
      # binary keeps this on the MIT tool and adds no third-party action.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. The point of this job is catching a secret that
          # reached the remote in an earlier commit and is no longer in the
          # working tree, which a filesystem scan cannot see.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/bin" gitleaks
          chmod +x "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Report gitleaks version
        run: gitleaks version

      - name: Scan full history for secrets
        # --redact keeps any finding out of this public repository's build log;
        # the log names the file and rule, never the value.
        run: gitleaks git --redact --no-banner --log-level error .
