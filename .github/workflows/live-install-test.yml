name: Live install/remove test (on demand)

# The real virtualized live test — see docs/implementation-plan.md
# section 3.5 — run on demand against a pull request, building
# orbit-launcher fresh from that PR's source (not a published
# artifact; that authoritative run happens as part of
# release-preview.yml, right after a preview build actually publishes,
# testing that exact artifact via the real bootstrap script). Opt-in
# via the run-live-matrix label, since it's slow — real image pulls,
# real health checks, minutes not seconds — and shouldn't burn CI time
# on every commit.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-test:
    name: Live test (${{ matrix.name }})
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-matrix')
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            container: ""
          - name: debian-12
            container:
              image: debian:12
              options: -v /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Docker CLI and Compose v2 (container jobs only)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io ca-certificates curl
          # Debian's own docker.io package doesn't include the Compose v2
          # CLI plugin at all ("docker: 'compose' is not a docker
          # command") — confirmed by actually running this locally before
          # trusting it. Fetch the plugin binary directly rather than
          # adding Docker's own apt repository just for one binary.
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.4.0/docker-compose-linux-x86_64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

      - name: Verify Docker daemon reachability (container jobs only)
        if: matrix.container != ''
        run: |
          docker info
          docker run --rm hello-world

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build orbit-launcher from source
        run: |
          go build -o "$RUNNER_TEMP/orbit-launcher" ./cmd/orbit-launcher
          echo "ORBIT_LAUNCHER_LIVE_BINARY=$RUNNER_TEMP/orbit-launcher" >> "$GITHUB_ENV"

      - name: Run the live test
        env:
          ORBIT_LAUNCHER_LIVE_RAW_LOG: ${{ runner.temp }}/live-raw.log
        run: go test -tags live -count=1 -v ./test/live/...

      - name: Docker state (always, for debugging)
        if: always()
        run: |
          docker ps -a || true
          docker volume ls || true

      - name: Upload raw pty transcript (always, for debugging)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: live-raw-log-${{ matrix.name }}
          path: ${{ runner.temp }}/live-raw.log.*
          if-no-files-found: ignore
          retention-days: 7
