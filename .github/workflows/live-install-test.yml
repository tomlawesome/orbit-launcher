name: Live install/remove test (on demand)

# The real virtualized live test — see docs/implementation-plan.md
# section 3.5 — run on demand against a pull request, building
# orbit-launcher fresh from that PR's source (not a published
# artifact; that authoritative run happens as part of
# release-preview.yml, right after a preview build actually publishes,
# testing that exact artifact via the real bootstrap script). Opt-in
# via the run-live-matrix label, since it's slow — real image pulls,
# real health checks, minutes not seconds — and shouldn't burn CI time
# on every commit.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-test:
    name: Live test (${{ matrix.name }})
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-matrix')
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            container: ""
          - name: debian-12
            container:
              image: debian:12
              options: -v /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Docker CLI (container jobs only)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io ca-certificates curl

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build orbit-launcher from source
        run: |
          go build -o "$RUNNER_TEMP/orbit-launcher" ./cmd/orbit-launcher
          echo "ORBIT_LAUNCHER_LIVE_BINARY=$RUNNER_TEMP/orbit-launcher" >> "$GITHUB_ENV"

      - name: Run the live test
        run: go test -tags live -count=1 -v ./test/live/...

      - name: Docker state (always, for debugging)
        if: always()
        run: |
          docker ps -a || true
          docker volume ls || true
