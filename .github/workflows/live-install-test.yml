name: Live install/remove test (on demand)

# The real virtualized live test — see docs/implementation-plan.md
# section 3.5 — run on demand against a pull request, building
# orbit-launcher fresh from that PR's source. This repo no longer
# publishes launcher binaries of its own (#171): Orbit builds, signs and
# ships the launcher, so there is no separately-published artifact to
# test here — only the freshly-built one. Opt-in via the
# run-live-matrix label, since it's slow — real image pulls, real
# health checks, minutes not seconds — and shouldn't burn CI time on
# every commit.
#
# Runs on ubuntu-latest only. A debian:12 container leg was tried and
# dropped (see issue #59): docker-compose.yml's bind-mounted volumes
# (.orbit-secrets etc.) resolve relative to the calling process's own
# filesystem, which inside a Docker-outside-of-Docker container is the
# wrapper container's filesystem, not the host's — so the host daemon
# actually creating the containers can't see them, and "docker compose
# up" fails outright before creating anything. Confirmed with a real
# raw pty transcript, not a guess. Fixing this properly means aligning
# host and container paths throughout the job, tracked as its own
# follow-up rather than blocking this on it — real Debian coverage for
# now comes from having actually run this test suite directly,
# repeatedly, on a real Debian machine during development (no
# container involved at all).
#
# Stable only. install.sh fetches only stable releases by itself; a preview
# image needs the release manifest, which this GitHub mirror does not have.
# So there is no channel input here, and preview runs live on GitLab, where
# the job hands install.sh the manifest (#194, #196).

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      orbit_branch:
        description: >-
          orbit branch to fetch install.sh from (empty = the production
          default, orbit main). This is the dispatchable way to run a live
          test against a non-default orbit branch's stable install.sh. A
          pre-release branch needs the preview image, which this mirror
          cannot install: preview runs live on GitLab (RUN_LIVE=true).
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-test:
    name: Live test
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-matrix')
    runs-on: ubuntu-latest
    # The suite's own budget is 30m (go test -timeout below). A job cap
    # under it turns a slow-but-passing run into a cancelled one with no
    # Go-level failure to read — which is exactly what happened on the
    # first orbit-branch dispatch.
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Point at the requested orbit branch's install.sh
        if: inputs.orbit_branch != ''
        run: |
          branch="${{ inputs.orbit_branch }}"
          echo "ORBIT_LAUNCHER_INSTALL_SCRIPT_URL=https://raw.githubusercontent.com/tomlawesome/orbit/$branch/scripts/install.sh" >> "$GITHUB_ENV"

      - name: Build orbit-launcher from source
        run: |
          go build -o "$RUNNER_TEMP/orbit-launcher" ./cmd/orbit-launcher
          echo "ORBIT_LAUNCHER_LIVE_BINARY=$RUNNER_TEMP/orbit-launcher" >> "$GITHUB_ENV"

      - name: Run the live test
        env:
          ORBIT_LAUNCHER_LIVE_RAW_LOG: ${{ runner.temp }}/live-raw.log
        run: go test -tags live -count=1 -v -timeout 30m ./test/live/...

      - name: Docker state (always, for debugging)
        if: always()
        run: |
          docker ps -a || true
          docker volume ls || true

      - name: Upload raw pty transcript (always, for debugging)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-raw-log
          path: ${{ runner.temp }}/live-raw.log.*
          if-no-files-found: ignore
          retention-days: 7
