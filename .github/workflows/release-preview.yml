name: Release preview

on:
  push:
    branches:
      - preview

concurrency:
  group: release-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and publish preview release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Sanity build and test
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      - name: Calculate version
        id: version
        run: echo "version=$(go run ./tools/calculateversion)" >> "$GITHUB_OUTPUT"

      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.17.1

      - name: Build release artifacts
        env:
          ORBIT_LAUNCHER_VERSION: "${{ steps.version.outputs.version }}-preview.${{ github.sha }}"
        run: goreleaser release --snapshot --clean --skip=validate

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/orbit-launcher_linux_*.tar.gz"

      - name: Publish mutable preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view preview-latest >/dev/null 2>&1; then
            gh release delete preview-latest --yes --cleanup-tag
          fi
          gh release create preview-latest \
            --target "${{ github.sha }}" \
            --title "Preview (${{ steps.version.outputs.version }}, ${{ github.sha }})" \
            --notes "Built from preview@${{ github.sha }}. Not a stable release — see docs/releasing.md." \
            --prerelease \
            dist/orbit-launcher_linux_amd64.tar.gz \
            dist/orbit-launcher_linux_arm64.tar.gz \
            dist/checksums.txt

  live_test:
    name: Live test (${{ matrix.name }})
    needs: build_and_publish
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Empty container: runs directly on the ubuntu-latest runner.
          - name: ubuntu-latest
            container: ""
          # install.sh runs strictly under bash + coreutils, whichever
          # distro it's invoked from — Debian's aren't Ubuntu's, and
          # assuming Ubuntu-only behaviour is universal is exactly the
          # distro-difference lesson from the orbit#281 CI investigation
          # this repo's own implementation plan calls out (section 3.5).
          # Docker-outside-of-Docker: the container talks to the
          # runner's real Docker daemon over the mounted socket (at the
          # same path, so the Docker CLI's default connection just
          # works), rather than needing its own nested daemon.
          - name: debian-12
            container:
              image: debian:12
              options: -v /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Docker CLI and Compose v2 (container jobs only)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io ca-certificates curl
          # Debian's own docker.io package doesn't include the Compose v2
          # CLI plugin at all ("docker: 'compose' is not a docker
          # command") — confirmed by actually running this locally before
          # trusting it. Fetch the plugin binary directly rather than
          # adding Docker's own apt repository just for one binary.
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.4.0/docker-compose-linux-x86_64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

      - name: Verify Docker daemon reachability (container jobs only)
        if: matrix.container != ''
        run: |
          docker info
          docker run --rm hello-world

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Get the just-published preview binary via the real bootstrap script
        run: |
          ORBIT_LAUNCHER_VERSION=preview-latest bash scripts/get-orbit-launcher.sh --version
          echo "ORBIT_LAUNCHER_LIVE_BINARY=$HOME/.cache/orbit-launcher/orbit-launcher" >> "$GITHUB_ENV"

      - name: Run the live test
        run: go test -tags live -count=1 -v ./test/live/...

      - name: Docker state (always, for debugging)
        if: always()
        run: |
          docker ps -a || true
          docker volume ls || true
