name: Release preview

on:
  push:
    branches:
      - preview

concurrency:
  group: release-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and publish preview release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Sanity build and test
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      - name: Calculate version
        id: version
        run: echo "version=$(go run ./tools/calculateversion)" >> "$GITHUB_OUTPUT"

      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.17.1

      - name: Build release artifacts
        env:
          ORBIT_LAUNCHER_VERSION: "${{ steps.version.outputs.version }}-preview.${{ github.sha }}"
        run: goreleaser release --snapshot --clean --skip=validate

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/orbit-launcher_linux_*.tar.gz"

      - name: Publish mutable preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view preview-latest >/dev/null 2>&1; then
            gh release delete preview-latest --yes --cleanup-tag
          fi
          gh release create preview-latest \
            --target "${{ github.sha }}" \
            --title "Preview (${{ steps.version.outputs.version }}, ${{ github.sha }})" \
            --notes "Built from preview@${{ github.sha }}. Not a stable release — see docs/releasing.md." \
            --prerelease \
            dist/orbit-launcher_linux_amd64.tar.gz \
            dist/orbit-launcher_linux_arm64.tar.gz \
            dist/checksums.txt

  live_test:
    name: Live test
    needs: build_and_publish
    runs-on: ubuntu-latest
    # Above the suite's own 30m budget (see the run step) so a slow run
    # reports a Go-level failure rather than a bare cancellation. This
    # leg installs orbit's promoted production image, which currently
    # finishes in about a minute — but the pre-release generation it
    # will promote to takes ~7m for the same work, so the headroom is
    # already needed rather than speculative.
    timeout-minutes: 35
    permissions:
      contents: read
    # ubuntu-latest only — a debian:12 container leg was tried and
    # dropped (see issue #59): docker-compose.yml's bind-mounted
    # volumes (.orbit-secrets etc.) resolve relative to the calling
    # process's own filesystem, which inside a Docker-outside-of-Docker
    # container is the wrapper container's filesystem, not the host's
    # — so the host daemon actually creating the containers can't see
    # them, and "docker compose up" fails outright before creating
    # anything. Confirmed with a real raw pty transcript, not a guess.
    # Real Debian coverage for now comes from having actually run this
    # test suite directly, repeatedly, on a real Debian machine during
    # development — no container involved at all.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Get the just-published preview binary via the real bootstrap script
        run: |
          ORBIT_LAUNCHER_VERSION=preview-latest bash scripts/get-orbit-launcher.sh --version
          echo "ORBIT_LAUNCHER_LIVE_BINARY=$HOME/.cache/orbit-launcher/orbit-launcher" >> "$GITHUB_ENV"

      - name: Run the live test
        env:
          ORBIT_LAUNCHER_LIVE_RAW_LOG: ${{ runner.temp }}/live-raw.log
        run: go test -tags live -count=1 -v -timeout 30m ./test/live/...

      - name: Docker state (always, for debugging)
        if: always()
        run: |
          docker ps -a || true
          docker volume ls || true

      - name: Upload raw pty transcript (always, for debugging)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-raw-log
          path: ${{ runner.temp }}/live-raw.log.*
          if-no-files-found: ignore
          retention-days: 7
