name: CodeQL

on:
  push:
    branches:
      - main
      - develop
      - dev
      - preview
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
      - dev
      - preview
      - "hotfix/**"
  schedule:
    - cron: "37 2 * * 6"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  # Cancel only a superseded pull-request commit. A push must never cancel the
  # validation of an earlier merge: the delivery model requires trusted evidence
  # for that exact merge SHA, and a cancelled run leaves it permanently without.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The GitHub Actions extractor only supports build-mode: none —
          # there is nothing to compile. Go is a compiled language and
          # needs autobuild to produce anything CodeQL can analyze.
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: "/language:${{ matrix.language }}"
